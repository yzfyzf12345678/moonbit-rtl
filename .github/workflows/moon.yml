name: MoonBit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: MoonBit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js for JavaScript tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install MoonBit on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Show stable toolchain
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: Check formatting
        run: |
          moon fmt
          git diff --exit-code

      - name: Check generated interfaces
        run: |
          moon info
          git diff --exit-code

      - name: Check all targets
        run: moon check --target all --deny-warn

      - name: Test all targets
        run: moon test --target all --deny-warn

      - name: Native build and smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc
          moon build --target native
          moon test --target native --deny-warn --enable-coverage
          moon coverage report -f summary

      - name: Enforce production source inventory
        if: runner.os == 'Linux'
        shell: bash
        run: |
          lines=$(find . -type f -name '*.mbt' \
            ! -name '*_test.mbt' \
            ! -name '*_wbtest.mbt' \
            ! -path './_build/*' \
            ! -path './.mooncakes/*' \
            -print0 | xargs -0 cat | wc -l)
          echo "Production MoonBit source lines: $lines"
          test "$lines" -ge 20000
